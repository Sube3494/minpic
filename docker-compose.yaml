version: '3.8'

services:
  minpic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minpic
    restart: unless-stopped
    ports:
      - "${APP_PORT}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=${REDIS_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - GITHUB_ID=${GITHUB_ID}
      - GITHUB_SECRET=${GITHUB_SECRET}
      - ADMIN_GITHUB_ID=${ADMIN_GITHUB_ID}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY}
    depends_on:
      - db
      - redis
    networks:
      - minpic-network

  db:
    image: postgres:16-alpine
    container_name: minpic-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - minpic-network

  redis:
    image: redis:7-alpine
    container_name: minpic-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - minpic-network

networks:
  minpic-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
